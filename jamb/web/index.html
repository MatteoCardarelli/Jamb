<!DOCTYPE html>
<html lang="it">
<head>
  <!-- Sostituito da `flutter build web --base-href`: deve iniziare e finire con "/". -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Jamb: l'app per gli staff e la Comunità Capi di un gruppo AGESCI. Ragazzi, appello, cassa, calendario, documenti e campo in un unico posto.">
  <meta name="theme-color" content="#1D2660">

  <!-- Installazione sulla schermata Home (Android e iPhone) -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Jamb">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>Jamb</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body { margin: 0; height: 100%; background: #F8FAFC; }
    #caricamento {
      position: fixed; inset: 0;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #1D2660;
    }
    #caricamento img { width: 96px; height: 96px; }
    #caricamento .nome { margin-top: 16px; font-size: 28px; font-weight: 800; }
    #caricamento .stato { margin-top: 6px; font-size: 14px; color: #64748B; }
  </style>
</head>
<body>
  <!-- Visibile finché Flutter non disegna la prima schermata. -->
  <div id="caricamento">
    <img src="icons/Icon-192.png" alt="">
    <div class="nome">Jamb</div>
    <div class="stato">Caricamento…</div>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var caricamento = document.getElementById('caricamento');
      if (caricamento) caricamento.remove();
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
