# Analisi statica e test a ogni push, su qualunque ramo. Se sono verdi:
# - su `preproduzione`, pubblicazione su un link di prova di Netlify, da
#   controllare prima di approvare il passaggio in produzione;
# - su `main`, pubblicazione sul sito vero (quello che vedono gli altri).
name: Flutter

on:
  push:

jobs:
  analisi-e-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: jamb
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # Il file con le credenziali reali non è versionato. I test non usano la
      # rete, quindi bastano valori fittizi perché il progetto compili.
      - name: Configurazione Supabase fittizia
        run: |
          mkdir -p lib/config
          cat > lib/config/supabase_config.dart <<'EOF'
          const supabaseUrl = 'https://progetto-fittizio.supabase.co';
          const supabaseAnonKey = 'chiave-fittizia-per-la-ci';
          EOF

      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  # Pubblica la versione web su Netlify a ogni push su main o su preproduzione,
  # solo se analisi e test sono verdi. Finché i segreti non sono impostati il
  # job si limita a dirlo, senza fallire. Segreti del repository (Settings →
  # Secrets and variables → Actions): NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID,
  # SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY.
  pubblica-web:
    needs: analisi-e-test
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/preproduzione')
    runs-on: ubuntu-latest
    # Una pubblicazione alla volta per ramo: se ne arriva una nuova, la vecchia si ferma.
    concurrency:
      group: pubblica-web-${{ github.ref_name }}
      cancel-in-progress: true
    defaults:
      run:
        working-directory: jamb
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
    steps:
      - name: Segreti presenti?
        id: segreti
        run: |
          if [ -n "$NETLIFY_AUTH_TOKEN" ] && [ -n "$NETLIFY_SITE_ID" ] && [ -n "$SUPABASE_URL" ] && [ -n "$SUPABASE_PUBLISHABLE_KEY" ]; then
            echo "pronti=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Pubblicazione saltata: mancano uno o più segreti (NETLIFY_AUTH_TOKEN, NETLIFY_SITE_ID, SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY)."
            echo "pronti=false" >> "$GITHUB_OUTPUT"
          fi
        working-directory: .

      - uses: actions/checkout@v7
        if: steps.segreti.outputs.pronti == 'true'

      - uses: subosito/flutter-action@v2
        if: steps.segreti.outputs.pronti == 'true'
        with:
          channel: stable
          flutter-version: 3.41.9
          cache: true

      # La configurazione reale non è versionata: si crea dai segreti. La chiave
      # pubblica finisce comunque nel sito (è pubblica per natura).
      - name: Configurazione Supabase
        if: steps.segreti.outputs.pronti == 'true'
        run: |
          mkdir -p lib/config
          cat > lib/config/supabase_config.dart <<EOF
          const supabaseUrl = '$SUPABASE_URL';
          const supabaseAnonKey = '$SUPABASE_PUBLISHABLE_KEY';
          EOF

      - name: Compilazione web
        if: steps.segreti.outputs.pronti == 'true'
        run: |
          flutter pub get
          flutter build web --release

      # main va sul sito vero; preproduzione su un link a parte,
      # https://preproduzione--<nome-del-sito>.netlify.app, che non tocca il sito vero.
      - name: Pubblicazione su Netlify
        if: steps.segreti.outputs.pronti == 'true'
        run: |
          if [ "$GITHUB_REF_NAME" = "main" ]; then
            destinazione="--prod"
          else
            destinazione="--alias preproduzione"
          fi
          npx --yes netlify-cli@27.16.1 deploy $destinazione \
            --no-build --dir build/web \
            --site "$NETLIFY_SITE_ID" \
            --message "$GITHUB_REF_NAME ${GITHUB_SHA::7}"
